services:
  streamlit:
    build:
      context: ..
      dockerfile: p5-deployment/Dockerfile
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-false}
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - chat-history:/app/p5-deployment/data
      - type: bind
        source: ../p4-agent/p3_retrieval/index
        target: /app/p4-agent/p3_retrieval/index
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../p4-agent/p3_retrieval/parsed
        target: /app/p4-agent/p3_retrieval/parsed
        read_only: true
        bind:
          create_host_path: false
      - ./certs:/app/p5-deployment/certs:ro
    environment:
      REDIS_URL: ""
      P3_RAG_PATH: /app/p4-agent/p3_retrieval
      LLM_LOG_PATH: /app/p5-deployment/data/logs/llm_calls.jsonl
      LLM_CACHE_PATH: /app/p5-deployment/data/llm_cache.sqlite
      LLM_LOCK_PATH: /app/p5-deployment/data/llm_api.lock

volumes:
  chat-history:
